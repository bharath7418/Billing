<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Login | Ramajayam Tailors & Readymades</title>
  
  <!-- Google Fonts for High-End Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* CSS RESET & VARIABLES */
    :root {
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #f1f5f9 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(184, 134, 11, 0.25);
      --gold-primary: #b8860b;
      --gold-dark: #8b6508;
      --gold-gradient: linear-gradient(135deg, #996515 0%, #d4af37 40%, #aa771c 100%);
      --text-dark: #0f172a;
      --text-muted: #475569;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --shadow-soft: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 20px rgba(184, 134, 11, 0.08);
      --font-heading: 'Cinzel', serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-gradient);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* BACKGROUND DECORATIVE ACCENTS */
    body::before,
    body::after {
      content: '';
      position: absolute;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(255,255,255,0) 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::before { top: -60px; left: -60px; }
    body::after { bottom: -60px; right: -60px; }

    /* CONTAINER CARD */
    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: var(--shadow-soft);
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* HEADER */
    .card-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #fefce8;
      border: 1px solid var(--gold-primary);
      color: var(--gold-primary);
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(184, 134, 11, 0.12);
    }

    .brand-badge svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    .shop-title {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .sub-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* FORM STYLING */
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-dark);
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--text-dark);
      outline: none;
      transition: all 0.25s ease;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 4px rgba(184, 134, 11, 0.15);
    }

    /* BUTTONS & ACTIONS */
    .btn-submit {
      width: 100%;
      padding: 14px 28px;
      margin-top: 10px;
      background: var(--gold-gradient);
      color: #ffffff;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 15px rgba(184, 134, 11, 0.25);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(184, 134, 11, 0.35);
    }

    .form-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed rgba(203, 213, 225, 0.8);
      font-size: 0.9rem;
    }

    .logout-link {
      color: #e11d48;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }

    .logout-link:hover {
      color: #be123c;
      text-decoration: underline;
    }

    .back-link {
      color: var(--text-muted);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--text-dark);
    }

    /* FOOTER CREDIT */
    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 0.75rem;
      color: #94a3b8;
    }

    /* MOBILE OPTIMIZATIONS */
    @media (max-width: 480px) {
      .login-card {
        padding: 32px 20px;
        border-radius: 20px;
      }

      .shop-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <main class="login-card">
    
    <!-- HEADER -->
    <div class="card-header">
      <div class="brand-badge">
        <!-- Key/Lock Icon -->
        <svg viewBox="0 0 24 24">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
      </div>
      <h1 class="shop-title">Shop Login</h1>
      <p class="sub-title">Ramajayam Billing System</p>
    </div>

    <!-- FORM -->
    <form method="POST" action="/shop_login">
      <div class="form-group">
        <label for="shop_username">Shop Username</label>
        <input type="text" id="shop_username" name="shop_username" placeholder="Enter username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-submit">Login to Billing</button>

      <div class="form-footer">
        <a href="/" class="back-link">&larr; Back to Welcome</a>
        <a href="/logout" class="logout-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Logout
        </a>
      </div>
    </form>

    <div class="footer-note">
      &copy; Ramajayam Tailors & Readymades
    </div>

  </main>

</body>
</html>
